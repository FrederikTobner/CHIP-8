name: Tests

on:
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Tests (${{matrix.preset}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The presets are defined in CMakePresets.json - the sanitizer presets also find memory leaks, memory errors and
        # undefined behavior in the tests (the tests are run with ctest, so every test is checked on its own)
        preset: [release, asan-debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install SDL2
      uses: ./.github/actions/install-sdl2

    - name: Configure CMake
      run: cmake --preset ${{matrix.preset}}

    - name: Build
      run: cmake --build --preset ${{matrix.preset}}

    - name: Run tests
      run: ctest --preset ${{matrix.preset}}
